<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320">
  <rect width="500" height="320" rx="18" fill="#f4ede1" />

  <!-- Computer: the "rect" hotspot -->
  <g>
    <rect x="30" y="30" width="190" height="130" rx="10" fill="#334155" />
    <rect x="44" y="44" width="162" height="100" rx="4" fill="#38bdf8" />
    <rect x="105" y="160" width="40" height="22" fill="#334155" />
    <rect x="70" y="182" width="110" height="14" rx="6" fill="#1e293b" />
  </g>

  <!-- Coffee cup (top-down view): the "circle" hotspot -->
  <g>
    <circle cx="350" cy="110" r="58" fill="#e7c9a1" />
    <circle cx="350" cy="110" r="42" fill="#8a5a2b" />
    <circle cx="350" cy="110" r="30" fill="#3f2411" />
    <path d="M340 44 q6 -10 0 -20" stroke="#cbd5e1" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M360 44 q6 -10 0 -20" stroke="#cbd5e1" stroke-width="3" fill="none" stroke-linecap="round" />
  </g>

  <!-- Croissant: the "poly" hotspot -->
  <g>
    <polygon
      points="140,275 120,240 130,205 170,185 230,175 290,180 330,200 355,230 360,255 340,275 310,260 270,250 230,248 190,252 160,262"
      fill="#c9884b"
      stroke="#8a5a2b"
      stroke-width="2"
      stroke-linejoin="round"
    />
    <path d="M170 210 q40 -15 90 0" stroke="#8a5a2b" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M190 235 q40 -12 80 0" stroke="#8a5a2b" stroke-width="3" fill="none" stroke-linecap="round" />
  </g>
</svg>
